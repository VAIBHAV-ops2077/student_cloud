<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📚 Student Management Portal</h1>
      <p class="subtitle">Manage your student database efficiently</p>
    </div>

    <div id="messageContainer"></div>

    <div class="main-content">
      <!-- Form Section -->
      <div class="form-section">
        <h2>➕ Add New Student</h2>
        <form id="studentForm">
          <input type="hidden" id="studentId">
          <div class="form-group">
            <input type="text" id="name" placeholder="Full Name" required>
          </div>
          <div class="form-group">
            <input type="text" id="rollNo" placeholder="Roll Number" required>
          </div>
          <div class="form-group">
            <input type="text" id="batch" placeholder="Batch (e.g., 2023)" required>
          </div>
          <div class="form-group">
            <input type="text" id="course" placeholder="Course (e.g., B.Tech CSE)" required>
          </div>
          <div class="form-group">
            <input type="tel" id="contact" placeholder="Contact Number" required>
          </div>
          <div class="form-buttons">
            <button type="submit" id="submitBtn">Add Student</button>
            <button type="button" id="resetBtn" style="display:inline-block;">Reset</button>
            <button type="button" id="cancelBtn" style="display:none;">Cancel</button>
          </div>
        </form>
      </div>

      <!-- List Section -->
      <div class="list-section">
        <div class="list-header">
          <h2>👥 Students List</h2>
          <div style="display: flex; gap: 10px;">
            <input type="text" id="searchInput" placeholder="🔍 Search by name or roll no...">
            <button id="refreshBtn" style="padding: 8px 16px; background: #5b6aff; color: white; border: none; border-radius: 4px; cursor: pointer;">🔄 Refresh</button>
          </div>
        </div>
        
        <div id="loadingIndicator" class="loading-spinner" style="display: flex; justify-content: center; align-items: center; padding: 40px; color: #999;">
          Loading students...
        </div>
        
        <div id="tableContainer" class="table-responsive" style="display: none;">
          <table id="studentTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Roll No</th>
                <th>Batch</th>
                <th>Course</th>
                <th>Contact</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr class="loading">
                <td colspan="7">No students found</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirmation Modal -->
  <div id="confirmModal" class="modal" style="display: none;">
    <div class="modal-content">
      <h3>Confirm Delete</h3>
      <p id="confirmMessage"></p>
      <div class="modal-buttons">
        <button id="confirmDeleteBtn" class="btn-danger">Delete</button>
        <button id="cancelDeleteBtn" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
